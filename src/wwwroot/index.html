<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaveDoctor – 7 Days to Die save editor</title>
<style>
:root{
  --bg:#12151a; --panel:#1a1f27; --panel2:#212833; --line:#2c3542; --text:#e6eaf0; --muted:#8d99aa;
  --accent:#4da3ff; --accent2:#2f7fd6; --ok:#3fb950; --warn:#e3a008; --err:#f0524f; --info:#58a6ff;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f3f5f8; --panel:#fff; --panel2:#eef1f5; --line:#d5dbe3; --text:#1b2330; --muted:#5d6b7e;
    --accent:#1566c0; --accent2:#0f4f99; --ok:#1a7f37; --warn:#9a6700; --err:#cf222e; --info:#0969da;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.danger{border-color:var(--err);color:var(--err)}
button.danger:hover:not(:disabled){background:var(--err);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.small{padding:2px 8px;font-size:12px}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 8px;min-width:0}
input[type=number]{width:110px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);border-color:var(--accent)}
a{color:var(--accent)}
code,.mono{font-family:var(--mono)}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top .brand{font-weight:700;font-size:16px;letter-spacing:.2px}
#top .brand span{color:var(--accent)}
#top .path{color:var(--muted);font-family:var(--mono);font-size:12px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.err{color:var(--err);border-color:var(--err)} .pill.warn{color:var(--warn);border-color:var(--warn)}
#banner{display:none;background:#5a1f1f;color:#ffd7d6;padding:7px 14px;font-size:13px}
#banner.show{display:block}
#body{flex:1;display:flex;min-height:0}
#side{width:310px;min-width:240px;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:8px 0}
#main{flex:1;overflow:auto;padding:16px 20px;min-width:0}
.grp{margin:2px 0}
.grp>.gh{display:flex;align-items:center;gap:6px;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;user-select:none}
.grp>.gh .cnt{margin-left:auto;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 18px;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:var(--panel2)}
.item.sel{background:var(--panel2);border-left-color:var(--accent)}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sz{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.info{background:var(--info)} .dot.warn{background:var(--warn)} .dot.error{background:var(--err)} .dot.run{background:var(--muted);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
h1{font-size:20px;margin:0 0 4px} h2{font-size:15px;margin:18px 0 8px} h3{font-size:13px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums} .stat span{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:10px 0 14px;flex-wrap:wrap}
.tab{padding:7px 14px;cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;color:var(--muted)}
.tab.sel{background:var(--panel);border-color:var(--line);color:var(--text);margin-bottom:-1px;border-bottom:1px solid var(--panel)}
.issue{display:flex;gap:10px;padding:8px 10px;border:1px solid var(--line);border-left-width:4px;border-radius:6px;margin-bottom:6px;background:var(--panel)}
.issue.Error{border-left-color:var(--err)} .issue.Warn{border-left-color:var(--warn)} .issue.Info{border-left-color:var(--info)} .issue.Ok{border-left-color:var(--ok)}
.issue .m{flex:1}
.sevtag{font-size:11px;font-weight:700;text-transform:uppercase;min-width:42px}
.sevtag.Error{color:var(--err)} .sevtag.Warn{color:var(--warn)} .sevtag.Info{color:var(--info)}
.repair{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel)}
.repair .d{flex:1} .repair .d small{display:block;color:var(--muted)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--bg)}
td input[type=text]{width:100%} td input[type=number]{width:100px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.field{display:flex;flex-direction:column;gap:2px;margin:0 12px 8px 0} .field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px}
.muted{color:var(--muted)} .ok{color:var(--ok)} .err{color:var(--err)} .warn{color:var(--warn)}
.savebar{position:sticky;bottom:-16px;margin:16px -20px -16px;padding:10px 20px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;z-index:5}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.show{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px}
#modal .box h2{margin-top:0}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:460px}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:6px;padding:9px 12px;box-shadow:0 4px 18px rgba(0,0,0,.35);white-space:pre-wrap}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--err)}
.hex{font-family:var(--mono);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto}
.hex .r{display:flex;gap:14px;white-space:pre;line-height:1.55}
.hex .off{color:var(--muted);width:76px;flex:none}
.hex .bytes{display:flex;gap:0}
.hex .b{padding:0 3px;cursor:pointer;border-radius:3px;display:inline-block;width:23px;text-align:center}
.hex .b:hover{background:var(--panel2)} .hex .b.mod{background:#7a4b00;color:#fff} .hex .b.hl{background:var(--accent2);color:#fff}
.hex .b.gap{margin-left:8px}
.hex .asc{color:var(--muted);letter-spacing:.5px}
.hex input{width:25px;font-family:var(--mono);font-size:12.5px;padding:0 2px;text-align:center}
canvas.rg{image-rendering:pixelated;border:1px solid var(--line);border-radius:6px;cursor:crosshair;max-width:100%}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12px;color:var(--muted)} .legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.tree{font-family:var(--mono);font-size:12.5px}
.tree .k{color:var(--muted)} .tree details{margin-left:14px} .tree summary{cursor:pointer}
.tree .leaf{margin-left:30px;display:flex;gap:6px;align-items:center;padding:1px 0}
.tree input[type=text],.tree input[type=number]{padding:0 4px;width:200px}
.sug{position:absolute;left:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;max-height:260px;overflow:auto;z-index:20;min-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.sug div{padding:4px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:12px} .sug div:hover{background:var(--panel2)} .sug small{color:var(--muted)}
.igrid{display:grid;gap:4px;margin-bottom:8px}
.cell{position:relative;width:64px;height:64px;background:var(--panel);border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.cell:hover{background:var(--panel2)} .cell.sel{outline:2px solid var(--accent);outline-offset:1px} .cell.active{box-shadow:0 0 0 2px var(--warn) inset}
.cell .cnt{position:absolute;right:3px;bottom:1px;font-size:12px;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000;color:#fff}
.cell .lbl{font-size:10px;color:var(--muted);text-align:center}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico img{object-fit:contain;pointer-events:none}
.ico .ini{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
.imgprev{max-width:100%;border:1px solid var(--line);border-radius:6px;background:#000;image-rendering:pixelated}
@media(max-width:820px){#side{width:100%;max-height:34vh} #body{flex-direction:column}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand">Save<span>Doctor</span></div>
    <div class="path" id="rootpath" title=""></div>
    <button id="btnOpen">Open save…</button>
    <button id="btnScan">Scan all</button>
    <button id="btnSnap" title="Zip the whole save folder into the backup area">Snapshot backup</button>
    <button id="btnBackups">Backups</button>
    <button id="btnLog">Log</button>
    <div class="grow"></div>
    <span class="pill" id="srvpill">…</span>
    <label class="muted" style="font-size:12px;display:flex;gap:5px;align-items:center" title="Only if you really know the game is not writing to this save"><input type="checkbox" id="chkForce"> allow writes while game runs</label>
  </div>
  <div id="banner"></div>
  <div id="body">
    <nav id="side"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="modal"><div class="box" id="modalbox"></div></div>
<div id="toasts"></div>

<script src="/viewer3d.js"></script>
<script>
'use strict';
const TOKEN = '__TOKEN__';
const $ = (s, el = document) => el.querySelector(s);

/* ───────────────────────── helpers ───────────────────────── */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') e[k] = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return e;
}
async function api(path, opt = {}) {
  const hasBody = opt.body !== undefined || opt.raw !== undefined;
  const r = await fetch(path, {
    method: opt.method || (hasBody ? 'POST' : 'GET'),
    headers: { 'X-SD-Token': TOKEN, ...(opt.body !== undefined ? { 'Content-Type': 'application/json' } : {}) },
    body: opt.raw !== undefined ? opt.raw : (opt.body !== undefined ? JSON.stringify(opt.body) : undefined),
  });
  let data = null;
  if ((r.headers.get('content-type') || '').includes('json')) data = await r.json();
  if (!r.ok) throw Object.assign(new Error((data && data.error) || r.statusText), { status: r.status, data });
  return data;
}
const qs = o => Object.entries(o).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
const url = (path, o = {}) => path + '?' + qs({ ...o, t: TOKEN });
function fmtSize(n) { if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'; return (n / 1048576).toFixed(2) + ' MB'; }
function toast(msg, kind = 'ok', ms = 5000) {
  const t = h('div', { class: 'toast ' + kind }, msg);
  $('#toasts').append(t); setTimeout(() => t.remove(), kind === 'err' ? Math.max(ms, 9000) : ms);
}
function modal(content, onclose) {
  const m = $('#modal'), box = $('#modalbox'); box.replaceChildren(content); m.classList.add('show');
  const close = () => { m.classList.remove('show'); onclose && onclose(); };
  m.onclick = e => { if (e.target === m) close(); };
  return close;
}
function closeModal() { $('#modal').classList.remove('show'); }
function confirmBox(title, body, okLabel = 'OK', danger = false) {
  return new Promise(res => {
    const done = v => { closeModal(); res(v); };
    const c = h('div', {}, h('h2', {}, title), h('div', { class: 'sub', style: 'white-space:pre-wrap' }, body),
      h('div', { class: 'row', style: 'justify-content:flex-end;margin-top:14px' },
        h('button', { onclick: () => done(false) }, 'Cancel'),
        h('button', { class: danger ? 'danger' : 'primary', onclick: () => done(true) }, okLabel)));
    modal(c, () => res(false));
  });
}
const sevOrder = { Ok: 0, Info: 1, Warn: 2, Error: 3 };
const dotClass = w => w === 'Error' ? 'error' : w === 'Warn' ? 'warn' : w === 'Info' ? 'info' : 'ok';
async function guarded(fn) {
  try { return await fn(); }
  catch (e) { toast(e.message || String(e), 'err'); console.error(e); }
}
function numInput(obj, key, opts = {}) {
  const i = h('input', { type: 'number', value: obj[key], step: opts.step ?? 'any', min: opts.min, max: opts.max, onchange: () => { const v = i.value === '' ? 0 : Number(i.value); obj[key] = v; markDirty(); opts.on && opts.on(v); } });
  return i;
}
function textInput(obj, key, opts = {}) {
  return h('input', { type: 'text', value: obj[key] ?? '', style: opts.style, onchange: e => { obj[key] = e.target.value; markDirty(); } });
}
function checkInput(obj, key) {
  return h('input', { type: 'checkbox', checked: !!obj[key], onchange: e => { obj[key] = e.target.checked; markDirty(); } });
}
function field(label, ...inputs) { return h('div', { class: 'field' }, h('label', {}, label), ...inputs); }

/* ───────────────────────── state ───────────────────────── */
const S = {
  state: null, files: [], scan: {}, scanRunning: false, sel: null, analysis: null, tab: 'issues',
  model: null, dirty: false, hexJump: null, psub: 'general',
  openGroups: { World: true, Players: true, Regions: true, 'Game state': true, 'Explored maps': false, 'Backup copies': false, 'Web map tiles': false, 'Config dumps': false },
};
function markDirty() { S.dirty = true; const b = $('#savebtn'); if (b) b.disabled = false; const t = $('#dirtytxt'); if (t) t.textContent = 'Unsaved changes'; }

/* ───────────────────────── boot ───────────────────────── */
async function refreshState() {
  S.state = await api('/api/state');
  const st = S.state;
  $('#rootpath').textContent = st.root || 'no save open'; $('#rootpath').title = st.root || '';
  const p = $('#srvpill');
  p.className = 'pill ' + (st.serverRunning ? 'err' : 'ok');
  p.textContent = st.serverRunning ? '● game/server running' : '● game stopped';
  $('#chkForce').checked = st.allowWhileRunning;
  const b = $('#banner');
  if (st.serverRunning && !st.allowWhileRunning) { b.textContent = 'The game/server is running (' + st.serverProcess + '). Reading is fine, but all write operations are blocked until you stop it – editing live files corrupts saves.'; b.classList.add('show'); }
  else if (st.serverRunning) { b.textContent = '⚠ Writes are enabled while the game is running. Only do this if you are certain nothing is saving to this folder.'; b.classList.add('show'); }
  else b.classList.remove('show');
}
async function openSave(path) {
  await api('/api/open', { body: { path } });
  S.sel = null; S.analysis = null; S.scan = {};
  await refreshState(); await loadFiles(); startScan(); renderMain();
}
async function loadFiles() {
  const r = await api('/api/files'); S.files = r.files; renderSide(true);
}
let pollTimer = null;
async function startScan() {
  if (!S.state || !S.state.open) return;
  clearTimeout(pollTimer);
  await api('/api/scan/start', { method: 'POST', body: {} });
  S.scanRunning = true; renderSide(true);
  const poll = async () => {
    const r = await api('/api/scan/status');
    S.scan = {}; for (const x of r.results) S.scan[x.rel] = x;
    S.scanTotal = r.total; S.scanDone = r.done; S.scanRunning = r.running;
    renderSide(true);
    if (S.sel === null && !S.dirty) renderMain();
    if (r.running) pollTimer = setTimeout(poll, 600);
  };
  poll();
}

/* ───────────────────────── sidebar ───────────────────────── */
function groupOf(f) {
  const r = f.rel;
  if (f.backupOf) return 'Backup copies';
  if (r.startsWith('ConfigsDump/')) return 'Config dumps';
  if (r.startsWith('map/')) return 'Web map tiles';
  if (/\.7rm$/i.test(r)) return 'Explored maps';
  if (/^Region\//i.test(r)) return 'Regions';
  if (/^Player\//i.test(r)) return 'Players';
  if (/\.dat$/i.test(r)) return 'Game state';
  return 'World';
}
function renderSide(keepScroll) {
  const side = $('#side'); const st = side.scrollTop; side.replaceChildren();
  if (!S.state || !S.state.open) { side.append(h('div', { class: 'sub', style: 'padding:12px' }, 'No save open.')); return; }
  side.append(h('div', { class: 'item' + (S.sel === null ? ' sel' : ''), onclick: () => { S.sel = null; S.analysis = null; S.dirty = false; renderSide(true); renderMain(); } },
    h('span', { class: 'dot ' + (S.scanRunning ? 'run' : overallDot()) }), h('span', { class: 'nm' }, 'Overview'),
    h('span', { class: 'sz' }, S.scanRunning ? ((S.scanDone || 0) + '/' + (S.scanTotal || '?')) : '')));
  const order = ['World', 'Players', 'Regions', 'Game state', 'Explored maps', 'Web map tiles', 'Backup copies', 'Config dumps'];
  const groups = {}; for (const f of S.files) (groups[groupOf(f)] ||= []).push(f);
  for (const g of order) {
    const list = groups[g]; if (!list) continue;
    const open = S.openGroups[g];
    const bad = list.filter(f => { const s = S.scan[f.rel]; return s && s.worst === 'Error'; }).length;
    const wrn = list.filter(f => { const s = S.scan[f.rel]; return s && s.worst === 'Warn'; }).length;
    side.append(h('div', { class: 'grp' },
      h('div', { class: 'gh', onclick: () => { S.openGroups[g] = !open; renderSide(true); } }, (open ? '▾ ' : '▸ ') + g,
        h('span', { class: 'cnt' }, bad ? h('span', { class: 'err' }, bad + ' bad ') : '', wrn ? h('span', { class: 'warn' }, wrn + ' warn ') : '', list.length)),
      open ? list.map(f => {
        const s = S.scan[f.rel];
        const nm = f.label || (g === 'World' || g === 'Game state' ? f.rel : f.rel.replace(/^(Region|Player)\//, ''));
        return h('div', { class: 'item' + (S.sel === f.rel ? ' sel' : ''), title: f.rel + (s && s.top ? '\n' + s.top : ''), onclick: () => selectFile(f.rel) },
          h('span', { class: 'dot ' + (s ? dotClass(s.worst) : (S.scanRunning ? 'run' : '')) }), h('span', { class: 'nm' }, nm), h('span', { class: 'sz' }, fmtSize(f.size)));
      }) : null));
  }
  if (keepScroll) side.scrollTop = st;
}
function overallDot() {
  let w = 0; for (const s of Object.values(S.scan)) { if (s.backupOf) continue; w = Math.max(w, sevOrder[s.worst]); }
  return ['ok', 'info', 'warn', 'error'][w];
}

/* ───────────────────────── overview ───────────────────────── */
function renderOverview() {
  const m = $('#main'); m.replaceChildren();
  if (!S.state || !S.state.open) { renderOpenPicker(m); return; }
  const all = Object.values(S.scan).filter(s => !s.backupOf);
  const bad = all.filter(s => s.worst === 'Error'), wrn = all.filter(s => s.worst === 'Warn');
  m.append(h('h1', {}, S.state.name || 'Save'), h('div', { class: 'sub mono' }, S.state.root));
  m.append(h('div', { class: 'cards' },
    h('div', { class: 'stat' }, h('b', {}, S.files.filter(f => !f.rel.startsWith('ConfigsDump/')).length), h('span', {}, 'save files')),
    h('div', { class: 'stat' }, h('b', { class: bad.length ? 'err' : 'ok' }, S.scanRunning ? '…' : bad.length), h('span', {}, 'damaged')),
    h('div', { class: 'stat' }, h('b', { class: wrn.length ? 'warn' : '' }, S.scanRunning ? '…' : wrn.length), h('span', {}, 'with warnings')),
    h('div', { class: 'stat' }, h('b', {}, S.scanRunning ? ((S.scanDone || 0) + '/' + (S.scanTotal || '?')) : 'done'), h('span', {}, 'scan progress'))));
  if (!S.scanRunning && !bad.length && !wrn.length) {

$('#chkForce').onchange = e => guarded(async () => { if (e.target.checked && !(await confirmBox('Allow writes while the game runs?', 'Writing to files the running game also writes will corrupt your save. Only enable this if the server is truly idle/stopped and the detection is wrong.', 'Allow', true))) { e.target.checked = false; return; } await api('/api/settings', { body: { allowWhileRunning: e.target.checked } }); await refreshState(); });
setInterval(() => { if (!document.hidden) guarded(refreshState); }, 8000);
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

(async function init() {
  await guarded(async () => {
    await refreshState();
    if (S.state.open) { await loadFiles(); startScan(); }
    renderSide(); renderMain();
  });
})();
</script>
</body>
</html>
